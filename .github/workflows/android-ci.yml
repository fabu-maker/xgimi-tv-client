name: Android TV build and checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK components
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and signed debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK for internal testing
        uses: actions/upload-artifact@v4
        with:
          name: xgimi-tv-unsigned-for-release-debug-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
