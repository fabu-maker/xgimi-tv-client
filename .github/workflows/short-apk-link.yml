name: Verify short APK download link
on:
  push:
    paths:
      - .github/workflows/short-apk-link.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published short APK link
        shell: bash
        run: |
          set -euo pipefail
          APK_URL='https://github.com/fabu-maker/xgimi-tv-client/releases/download/v0.1.0/projektor-tv.apk'
          SHORT_URL='https://urlvanish.com/254f8261'
          curl -fsSL --get --data-urlencode 'format=simple' --data-urlencode "url=${SHORT_URL}" 'https://urlvanish.com/api/expand' | tee expanded
          test "$(cat expanded)" = "${APK_URL}"
          curl -sS -D headers -o /dev/null --max-time 30 "${SHORT_URL}"
          cat headers
          location="$(tr -d '\r' < headers | grep -i '^location:' | head -1 | sed -E 's/^[Ll]ocation:[[:space:]]*//' || true)"
          echo "Redirect target: ${location}"
          test "${location}" = "${APK_URL}"
          echo "SHORT_APK_URL=${SHORT_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Verified short APK URL::${SHORT_URL}"
