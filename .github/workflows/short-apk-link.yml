name: Create short APK download link
on:
  push:
    paths:
      - .github/workflows/short-apk-link.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Shorten and verify published APK
        env:
          APK_URL: https://github.com/fabu-maker/xgimi-tv-client/releases/download/v0.1.0/projektor-tv.apk
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://api.github.com/repos/fabu-maker/xgimi-tv-client/releases/tags/v0.1.0" | python3 -c 'import json,sys; a=json.load(sys.stdin)["assets"]; assert any(x["name"]=="projektor-tv.apk" and x["state"]=="uploaded" for x in a)'
          for domain in v.gd urlvanish.com; do
            if [ "${domain}" = 'v.gd' ]; then
              endpoint='https://v.gd/create.php'
            else
              endpoint='https://urlvanish.com/api/shorten'
            fi
            echo "Trying ${domain}"
            short="$(curl -sSL --retry 1 --max-time 20 --get --data-urlencode 'format=simple' --data-urlencode "url=${APK_URL}" "${endpoint}" || true)"
            echo "Result: ${short}"
            case "${short}" in
              https://v.gd/*|https://urlvanish.com/*) ;;
              *) continue;;
            esac
            if [ "${domain}" = 'v.gd' ]; then
              path="${short##*/}"
              expanded="$(curl -fsSL --get --data-urlencode 'format=simple' --data-urlencode "shorturl=${path}" 'https://v.gd/forward.php' || true)"
            else
              expanded="$(curl -fsSL --get --data-urlencode 'format=simple' --data-urlencode "url=${short}" 'https://urlvanish.com/api/expand' || true)"
            fi
            echo "Expanded: ${expanded}"
            if [ "${expanded}" = "${APK_URL}" ]; then
              echo "SHORT_APK_URL=${short}" >> "${GITHUB_STEP_SUMMARY}"
              echo "::notice title=Short APK link::${short}"
              exit 0
            fi
          done
          echo "No short URL could be created and verified" >&2
          exit 1
